# 이 프로젝트는 Cloudflare **Workers** 프로젝트다 (static assets 모델).
# 배포: `wrangler deploy` (Workers). 대시보드 Workers 빌드 설정:
#   - Build command : npm run build   (dist 생성)
#   - Deploy command: npx wrangler deploy
#   → Workers Builds가 자동 주입하는 토큰이 Workers 배포 권한을 가지므로 별도 토큰 불필요.
name = "link-downloader"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# 정적 자산(빌드된 dist)을 서빙. Worker가 먼저 실행되어 /api/* 를 처리하고,
# 그 외에는 env.ASSETS 로 위임하며 매칭이 없으면 index.html 로 SPA 폴백한다.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# KV 네임스페이스 바인딩. 로컬(`wrangler dev`)은 자동으로 로컬 KV를 사용한다.
[[kv_namespaces]]
binding = "LINKDL_KV"
id = "7646327020a142b68c982ea3cfda9f3d"          # 프로덕션
preview_id = "83c9668bfe47445cbc4f893f424dec88"  # 프리뷰
