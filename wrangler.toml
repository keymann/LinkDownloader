# 이 프로젝트는 Cloudflare **Pages** 프로젝트다 (Workers 아님).
# 따라서 배포는 반드시 `wrangler pages deploy` 를 사용한다. `wrangler deploy`(Workers 전용)는 오류가 난다.
# Cloudflare 대시보드 빌드 설정:
#   - Build command : npm run build
#   - Deploy command: npx wrangler pages deploy   (또는 비워두고 Build output = dist)
name = "link-downloader"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# KV 네임스페이스 바인딩. 로컬(`wrangler pages dev`)은 자동으로 로컬 KV를 사용한다.
# 프로덕션 배포 전 `wrangler kv namespace create LINKDL_KV`로 생성 후 아래 id를 채운다.
[[kv_namespaces]]
binding = "LINKDL_KV"
id = "REPLACE_WITH_PRODUCTION_KV_ID"
